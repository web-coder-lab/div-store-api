<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050816"/>
<title>Div Store</title>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand" id="hdrTitle">DIV STORE</div>
    <button type="button" class="icon-btn" id="btnSearch" title="Search">⌕</button>
  </header>

  <main id="view"></main>

  <nav class="bottom">
    <button type="button" class="tab on" data-tab="apps"><span class="i">▣</span>Apps</button>
    <button type="button" class="tab" data-tab="games"><span class="i">▶</span>Games</button>
    <button type="button" class="tab" data-tab="research"><span class="i">◈</span>Research</button>
  </nav>
</div>

<!-- Install sheet -->
<div id="installMask" class="mask hidden">
  <div class="sheet">
    <div class="handle"></div>
    <h3 id="insName">App</h3>
    <p id="insStatus" class="dim">Preparing…</p>
    <div class="ring-wrap">
      <svg viewBox="0 0 96 96" class="ring">
        <circle cx="48" cy="48" r="40" class="ring-bg"/>
        <circle cx="48" cy="48" r="40" class="ring-fg" id="insRing"/>
      </svg>
      <span id="insPct">0%</span>
    </div>
    <button type="button" class="btn ghost" id="insClose">Close</button>
  </div>
</div>

<script>
window.DIV_API = 'https://div-store-api.onrender.com';
</script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
