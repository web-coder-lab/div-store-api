<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Apps — DIV STORE</title>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>
<header class="nav"><div class="container nav-inner">
  <a class="brand" href="/"><span class="logo">DS</span><span>DIV STORE</span></a>
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/apps.html">Apps</a>
    <a href="/studio.html">Studio</a>
    <a href="/about.html">About</a>
    <a class="btn" href="/apps.html" style="padding:8px 14px">Browse</a>
  </nav>
</div></header>
<main class="container" style="padding-top:28px">
  <div class="section-head">
    <div>
      <h1 style="font-size:1.8rem;letter-spacing:-.02em">Apps</h1>
      <p>Filter by category or search by name</p>
    </div>
  </div>
  <div class="search-wrap">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="Search apps…" autocomplete="off"/>
  </div>
  <div id="chips" class="chips"></div>
  <div id="list" class="grid"><div class="state"><div class="spinner"></div>Loading apps…</div></div>
</main>
<footer><div class="container footer-grid">
  <div><strong>DIV STORE</strong><span>Android apps, simple and safe. Black &amp; white design.</span></div>
  <div><strong>Explore</strong><a href="/apps.html">All apps</a><a href="/studio.html">Developer Studio</a><a href="/about.html">About</a></div>
  <div><strong>Legal</strong><a href="/privacy">Privacy</a><a href="/terms">Terms</a></div>
  <div><strong>Support</strong><a href="mailto:workn8312@gmail.com">workn8312@gmail.com</a></div>
</div></footer>
<script src="/assets/app.js"></script>
<script>
let selected = null;
let timer = null;
const list = document.getElementById('list');
const chips = document.getElementById('chips');

async function load() {
  list.innerHTML = '<div class="state"><div class="spinner"></div></div>';
  const q = document.getElementById('q').value.trim();
  const params = new URLSearchParams();
  if (selected) params.set('category', selected);
  if (q) params.set('search', q);
  try {
    const data = await DivStore.api('/api/apps' + (params.toString() ? '?' + params : ''));
    const apps = DivStore.appsFrom(data);
    list.innerHTML = apps.length
      ? apps.map(DivStore.appCard).join('')
      : '<div class="state">No apps match this filter.</div>';
  } catch (e) {
    list.innerHTML = '<div class="state">' + DivStore.escapeHtml(e.message) + '</div>';
  }
}

(async () => {
  try {
    const cats = DivStore.catsFrom(await DivStore.api('/api/categories'));
    chips.innerHTML = '<button type="button" class="chip active" data-cat="">All</button>' +
      cats.map(c => '<button type="button" class="chip" data-cat="' + DivStore.escapeAttr(c.name) + '">' + DivStore.escapeHtml(c.name) + '</button>').join('');
    chips.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        chips.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        selected = btn.dataset.cat || null;
        load();
      });
    });
  } catch (_) {
    chips.innerHTML = '<button type="button" class="chip active">All</button>';
  }
  load();
})();

document.getElementById('q').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(load, 350);
});
</script>
</body>
</html>
